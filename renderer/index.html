<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WhatsApp Excel Sender</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 14px 20px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      font-size: 18px;
      font-weight: 600;
    }
    .container {
      display: flex;
      flex: 1;
      min-height: 0;
    }
    .left {
      width: 340px;
      padding: 18px;
      background: #1e293b;
      border-right: 1px solid #334155;
      overflow-y: auto;
    }
    .right {
      flex: 1;
      display: flex;
      flex-direction: row;
      min-width: 0;
    }
    .side-panel {
      width: 380px;
      flex-shrink: 0;
      padding: 14px;
      background: #1e293b;
      border-right: 1px solid #334155;
      overflow-y: auto;
      display: none;
    }
    .side-panel.visible { display: block; }
    .field { margin-bottom: 14px; }
    label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 5px; }
    input[type="text"], input[type="number"] {
      width: 100%;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #e2e8f0;
      font-size: 13px;
    }
    .file-row { display: flex; gap: 6px; }
    .file-row input { flex: 1; }
    button {
      padding: 9px 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      background: #334155;
      color: #e2e8f0;
    }
    button.primary { background: #16a34a; color: #fff; width: 100%; margin-top: 6px; }
    button.primary:hover { background: #15803d; }
    button.stop { background: #dc2626; color: #fff; width: 100%; margin-top: 6px; }
    button.stop:hover { background: #b91c1c; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .check { display: flex; align-items: center; gap: 8px; font-size: 13px; }
    .check input { width: auto; }

    .panel { display: none; margin-bottom: 14px; }
    .panel.visible { display: block; }

    #qrBox {
      text-align: center;
      padding: 20px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
    }
    #qrBox img {
      background: #fff;
      padding: 10px;
      border-radius: 8px;
      max-width: 100%;
    }
    #hotspotBox {
      padding: 20px;
      background: #422006;
      border: 1px solid #b45309;
      border-radius: 8px;
      text-align: center;
    }
    #hotspotBox button { background: #d97706; color: #fff; margin-top: 10px; }

    #logPane {
      flex: 1;
      margin: 0;
      padding: 12px;
      background: #0b1120;
      overflow-y: auto;
      font-family: "Cascadia Code", Consolas, monospace;
      font-size: 14px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    #summaryBox {
      padding: 16px;
      background: #052e16;
      border: 1px solid #166534;
      border-radius: 8px;
      overflow-y: auto;
    }
    #summaryBox table { width: 100%; border-collapse: collapse; font-size: 13px; }
    #summaryBox td { padding: 5px 4px; border-bottom: 1px solid #14532d; }
    #summaryBox td:first-child { color: #86efac; }
    .status-bar {
      padding: 8px 16px;
      border-top: 1px solid #334155;
      background: #1e293b;
      font-size: 12px;
      color: #94a3b8;
    }
    .error { color: #fca5a5; }
    .muted { color: #64748b; }
  </style>
</head>
<body>
  <header>WhatsApp Excel Sender</header>

  <div class="container">
    <div class="left">
      <h3 style="margin-top:0;">Run settings</h3>

      <div class="field">
        <label>Excel file location</label>
        <div class="file-row">
          <input type="text" id="excelPath" placeholder="C:/path/to/file.xlsx" />
          <button id="browseBtn" type="button">Browse</button>
        </div>
      </div>

      <div class="field">
        <label>Maintenance tools password</label>
        <div class="file-row">
          <input type="password" id="maintenancePassword" placeholder="Enter password to unlock" />
          <button id="unlockBtn" type="button">Unlock</button>
        </div>
      </div>

      <div class="field">
        <button id="removeDupBtn" type="button" style="width:100%; margin-top:6px;" disabled>Remove Duplicate Rows</button>
      </div>
      <div class="field">
        <button id="sortBtn" type="button" style="width:100%;" disabled>Sort by Customer Manager (A-Z)</button>
      </div>

      <div class="field">
        <label>Start row</label>
        <input type="number" id="startRow" placeholder="e.g. 202" min="2" required />
      </div>

      <div class="field">
        <label>End row</label>
        <input type="number" id="endRow" placeholder="e.g. 365" min="2" required />
      </div>

      <div class="field check">
        <input type="checkbox" id="dryRun" />
        <label style="margin:0;">Dry run (validate only, no send)</label>
      </div>

      <div class="field check">
        <input type="checkbox" id="detectDuplicate" checked />
        <label style="margin:0;">Detect duplicates in memory</label>
      </div>

      <button class="primary" id="startBtn" type="button" disabled>Start</button>
      <button class="stop" id="stopBtn" type="button" disabled>Stop</button>

      <div id="summaryBox" class="panel" style="margin-top:18px;"></div>
    </div>

    <div class="right">
      <div class="side-panel" id="sidePanel">
        <div id="qrBox" class="panel">
          <div style="margin-bottom:10px; font-size:14px;">
            Scan this QR with your phone<br />
            <span class="muted">WhatsApp → Settings → Linked Devices → Link a Device</span>
          </div>
          <img id="qrImg" alt="QR code" style="display:none;" />
        </div>

        <div id="hotspotBox" class="panel">
          <div>30-row batch complete. Did you connect the WiFi to the next phone hotspot?</div>
          <button id="confirmBtn" type="button">Yes, connected — continue</button>
        </div>
      </div>

      <pre id="logPane"></pre>
    </div>
  </div>

  <div class="status-bar" id="statusBar">Ready.</div>

  <script src="./renderer.js"></script>
</body>
</html>
